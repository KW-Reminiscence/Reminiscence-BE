services:
  api:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: ${CONTAINER_NAME:?CONTAINER_NAME is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:?HOST_PORT is required}:8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 20s
