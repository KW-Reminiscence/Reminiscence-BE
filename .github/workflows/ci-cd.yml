name: CI/CD

on:
  workflow_dispatch:
    inputs:
      apply_json_migrations:
        description: Apply the reviewed JSON migration before release
        required: true
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Run linter
        run: uv run ruff check .

      - name: Run type check
        run: uv run mypy

      - name: Verify OpenAPI contract
        run: uv run python scripts/export_openapi.py --check

  build:
    name: Build and publish image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      api-image-reference: ghcr.io/kw-reminiscence/reminiscence-be@${{ steps.api-image.outputs.digest }}
      web-image-reference: ghcr.io/kw-reminiscence/reminiscence-web-release@${{ steps.web-image.outputs.digest }}
      api-commit: ${{ github.sha }}
      web-commit: ${{ steps.web-source.outputs.commit }}
      openapi-sha256: ${{ steps.contract.outputs.sha256 }}

    env:
      IMAGE_NAME: ghcr.io/kw-reminiscence/reminiscence-be
      WEB_IMAGE_NAME: ghcr.io/kw-reminiscence/reminiscence-web-release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out web release source
        uses: actions/checkout@v4
        with:
          repository: KW-Reminiscence/Reminiscence-FE
          path: frontend-release

      - name: Capture exact web commit
        id: web-source
        run: printf 'commit=%s\n' "$(git -C frontend-release rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend-release/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend-release/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: frontend-release
        run: pnpm install --frozen-lockfile

      - name: Verify exact web commit against current API contract
        working-directory: frontend-release
        env:
          OPENAPI_SCHEMA_PATH: ../openapi.json
        run: |
          pnpm api:check
          pnpm test
          pnpm lint
          pnpm typecheck
          pnpm build

      - name: Install Playwright Chromium for exact web commit
        working-directory: frontend-release
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify exact web commit browser flows
        working-directory: frontend-release
        run: pnpm test:e2e

      - name: Capture OpenAPI contract hash
        id: contract
        run: printf 'sha256=%s\n' "$(sha256sum openapi.json | cut -d ' ' -f 1)" >>"${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish verified ARM64 web image
        id: web-image
        uses: docker/build-push-action@v6
        with:
          context: frontend-release
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:${{ steps.web-source.outputs.commit }}
            ${{ env.WEB_IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.web-source.outputs.commit }}
          cache-from: type=gha,scope=web-release
          cache-to: type=gha,mode=max,scope=web-release
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, Linux, ARM64, reminiscence]
    concurrency:
      group: reminiscence-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    env:
      API_IMAGE_REFERENCE: ${{ needs.build.outputs.api-image-reference }}
      WEB_IMAGE_REFERENCE: ${{ needs.build.outputs.web-image-reference }}
      API_COMMIT: ${{ needs.build.outputs.api-commit }}
      WEB_COMMIT: ${{ needs.build.outputs.web-commit }}
      OPENAPI_SHA256: ${{ needs.build.outputs.openapi-sha256 }}
      APPLY_JSON_MIGRATIONS: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.apply_json_migrations && '1' || '0' }}

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Install application secrets
        env:
          APPLICATION_SECRETS_JSON: ${{ secrets.APPLICATION_SECRETS_JSON }}
        run: |
          set -Eeuo pipefail
          destination=/home/ubuntu/apps/reminiscence/production/application-secrets.json
          if [[ -z "${APPLICATION_SECRETS_JSON:-}" ]]; then
            echo "Missing required repository secret: APPLICATION_SECRETS_JSON" >&2
            exit 78
          fi
          install -d -m 0750 "$(dirname "${destination}")"
          umask 077
          temporary="$(mktemp "${destination}.XXXXXX")"
          cleanup() {
            rm -f "${temporary}"
          }
          trap cleanup EXIT
          printf '%s' "${APPLICATION_SECRETS_JSON}" >"${temporary}"
          chmod 0600 "${temporary}"
          jq -e '
            type == "object"
            and .schema_version == 1
            and (.guardian_password | type == "string" and length >= 8)
            and (.tablet_pairing_code | type == "string" and length >= 6)
            and (.codex_lb_api_key | type == "string" and length >= 8)
            and (.care_recipient.name | type == "string" and length > 0)
            and (.guardian.email | type == "string" and length > 0)
            and (.smtp.host | type == "string" and length > 0)
            and (.smtp.port | type == "number" and . >= 1 and . <= 65535)
            and (.smtp.username | type == "string" and length > 0)
            and (.smtp.app_password | type == "string" and length > 0)
            and (.smtp.from_name | type == "string" and length > 0)
          ' "${temporary}" >/dev/null
          mv -f "${temporary}" "${destination}"
          trap - EXIT

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Deploy with Docker Compose
        run: >-
          ./scripts/deploy.sh production
          "${API_IMAGE_REFERENCE}" "${WEB_IMAGE_REFERENCE}"
          "${API_COMMIT}" "${WEB_COMMIT}" "${OPENAPI_SHA256}"

      - name: Log out from GHCR
        if: always()
        run: docker logout ghcr.io
