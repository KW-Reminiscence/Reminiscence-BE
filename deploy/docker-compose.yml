services:
  api:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: ${CONTAINER_NAME:?CONTAINER_NAME is required}
    restart: unless-stopped
    network_mode: host
    command:
      - uvicorn
      - reminiscence.main:app
      - --host
      - 127.0.0.1
      - --port
      - "${HOST_PORT:?HOST_PORT is required}"
      - --proxy-headers
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ${NOTIFICATION_CONFIG_FILE:?NOTIFICATION_CONFIG_FILE is required}
        target: /run/secrets/notification-config.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen; assert
          urlopen('http://127.0.0.1:${HOST_PORT}/health', timeout=2).status == 200
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 20s
