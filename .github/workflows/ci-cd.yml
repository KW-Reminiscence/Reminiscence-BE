name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Run linter
        run: uv run ruff check .

      - name: Run type check
        run: uv run mypy

      - name: Verify OpenAPI contract
        run: uv run python scripts/export_openapi.py --check

  build:
    name: Build and publish image
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      api-image-reference: ghcr.io/kw-reminiscence/reminiscence-be@${{ steps.api-image.outputs.digest }}
      web-image-reference: ghcr.io/kw-reminiscence/reminiscence-fe@${{ steps.web-image.outputs.digest }}

    env:
      IMAGE_NAME: ghcr.io/kw-reminiscence/reminiscence-be
      WEB_IMAGE_NAME: ghcr.io/kw-reminiscence/reminiscence-fe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Resolve verified web image digest
        id: web-image
        env:
          WEB_IMAGE_REFERENCE: ${{ env.WEB_IMAGE_NAME }}:main
        run: |
          digest="$(docker buildx imagetools inspect "${WEB_IMAGE_REFERENCE}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid web image digest: ${digest}" >&2
            exit 1
          fi
          printf 'digest=%s\n' "${digest}" >>"${GITHUB_OUTPUT}"

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: build
    runs-on: [self-hosted, Linux, ARM64, reminiscence]
    concurrency:
      group: reminiscence-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    env:
      API_IMAGE_REFERENCE: ${{ needs.build.outputs.api-image-reference }}
      WEB_IMAGE_REFERENCE: ${{ needs.build.outputs.web-image-reference }}

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Deploy with Docker Compose
        run: ./scripts/deploy.sh production "${API_IMAGE_REFERENCE}" "${WEB_IMAGE_REFERENCE}"

      - name: Log out from GHCR
        if: always()
        run: docker logout ghcr.io
